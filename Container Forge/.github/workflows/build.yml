name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build
        run: make

      - name: Show help
        run: ./container-forge help

      - name: Verify repository is clean after build
        run: git status --short
